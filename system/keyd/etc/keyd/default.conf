[ids]
*

[main]
# Remap Caps Lock to Left Control
capslock = leftcontrol
rightalt = layer(special)

# Remap the keycode 94 key to Escape
# This key is usually the 'less/greater' key on some keyboards
# You may need to verify the key name using `sudo keyd -m`
102nd = esc

# Optional: If Right Alt is not functioning as AltGr, map it
# rightalt = altgr

# Remap specific keys with AltGr to produce special characters
[special]
a = ä
o = ö
u = ü
s = ß
e = €

[special+shift]
a = Ä
o = Ö
u = Ü
s = ẞ  # Capital sharp S
